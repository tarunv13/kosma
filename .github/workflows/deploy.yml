name: Deploy

# Deploy only after CI has passed on the same commit.
#
# Render's own auto-deploy fires on push, before any test has run, so a commit
# that breaks the suite reaches production and stays there until someone
# notices. `workflow_run` waits for CI to finish and then checks its
# conclusion, so the only commits that reach the service are ones that were
# green.
#
# This also needs no GitHub App: Render exposes a per-service deploy hook, and
# calling it is the whole mechanism. Nothing is granted access to the
# repository, which is a smaller permission surface than the App's read and
# write over actions, checks, deployments, hooks and workflows.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    # A skipped or failed CI run must not deploy. `workflow_run` fires on any
    # completion, so the conclusion has to be checked explicitly.
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Call the Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK is not set. Add it under" \
                 "Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          sha="${{ github.event.workflow_run.head_sha }}"
          echo "CI passed for ${sha}. Requesting a deploy."

          # -sS so failures are visible, and the body is captured rather than
          # printed blind: the hook URL contains a key and must never be
          # echoed, but Render's response is safe to show.
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST "$HOOK")
          echo "Render responded ${code}"
          cat response.txt || true

          case "$code" in
            2*) echo "Deploy requested." ;;
            *)  echo "::error::Render refused the deploy hook (HTTP ${code})."
                exit 1 ;;
          esac
