[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "kosma"
version = "0.3.0"
description = "Privacy-first Vedic Soul Blueprint generator. Your sky, your story, in five letters."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "KOSMA contributors" }]
keywords = ["vedic", "astrology", "swiss-ephemeris", "kp", "jaimini", "navamsa", "pdf", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Religion",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi==0.138.1",
    "uvicorn[standard]==0.48.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "pyswisseph==2.10.3.2",
    "reportlab==5.0.0",
    "slowapi==0.1.9",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
# Client-held encrypted memory. Kept optional so the default install stays
# minimal and the pinned runtime set stays easy to keep CVE-clean.
memory = [
    "cryptography>=44.0",
]
dev = [
    "cryptography>=44.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/tarunv13/kosma"
Issues = "https://github.com/tarunv13/kosma/issues"
Source = "https://github.com/tarunv13/kosma"
Changelog = "https://github.com/tarunv13/kosma/blob/main/CHANGELOG.md"

# ── Tooling ────────────────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["kosma"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist", "scripts/out_test.pdf"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter when reasonable)
    "B008",   # function calls in arg defaults — common in FastAPI
    "RUF012", # mutable class attributes — fine for our dataclasses
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"scripts/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_decorators = false  # FastAPI / slowapi decorators
ignore_missing_imports = true        # for swisseph, reportlab.* C extensions
exclude = [".venv", "build", "dist", "scripts"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:reportlab.*",
    "ignore::DeprecationWarning:swisseph.*",
]

[tool.coverage.run]
branch = true
source = ["kosma"]
omit = ["kosma/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
